            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>

        </button>

        <!-- Language Switcher -->
        <div class="flex items-center gap-3 text-[12px] font-sans" role="group" aria-label="Language switcher">
